name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;33.0.2"
          sdkmanager --install "platforms;android-33"
          sdkmanager --install "cmdline-tools;latest"

      # WireGuard 同源方式：用仓库里提交的 debug.keystore 给 release 签名，
      # 不依赖任何 GitHub Secrets；每次产物签名一致，可正常覆盖安装更新。
      - name: Use committed debug keystore for release signing
        run: |
          cp .signing/debug.keystore app/scrcpy.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleScrcpyRelease
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidMirror-release
          path: app/build/outputs/apk/scrcpy/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/scrcpy/release/*.apk